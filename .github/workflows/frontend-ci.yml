name: "Frontend Next.js CI/CD Pipeline"

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  # Endpoint usado cuando la repository variable aun no esta configurada.
  # No hay ambiente de preview/staging: el artefacto siempre apunta a produccion.
  FALLBACK_API_URL: "https://api.alojamientosolidario.co/api/listings"

jobs:
  frontend-ci:
    name: "Local Validation Parity (typecheck / lint / test / build)"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Verify OpenWolf project index
        run: |
          before_file="$(mktemp)"
          after_file="$(mktemp)"

          git show HEAD:.wolf/anatomy.md | sed -E 's/(Last scanned: ).*/\1<normalized>/' > "$before_file"
          npx --yes openwolf@2.0.1 scan
          sed -E 's/(Last scanned: ).*/\1<normalized>/' .wolf/anatomy.md > "$after_file"

          if ! diff -u "$before_file" "$after_file" > /tmp/openwolf-anatomy.diff; then
            echo "::warning title=OpenWolf::OpenWolf anatomy changed beyond timestamp metadata. Run 'npx --yes openwolf@2.0.1 scan' locally and commit .wolf updates."
            cat /tmp/openwolf-anatomy.diff
          fi

      # Los tres pasos siguientes son exactamente los que corre `npm run validate`
      # en local (typecheck -> lint -> test). Se ejecutan por separado para que la
      # anotacion de fallo en GitHub apunte al check concreto que se rompio.
      - name: Type Check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit Tests
        run: npm run test

      - name: Resolve API base URL
        id: api
        env:
          REPO_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          if [ -n "$REPO_API_URL" ]; then
            echo "url=$REPO_API_URL" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=NEXT_PUBLIC_API_URL::Repository variable NEXT_PUBLIC_API_URL is not set; falling back to $FALLBACK_API_URL."
            echo "url=$FALLBACK_API_URL" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Next.js Static Export
        env:
          NEXT_PUBLIC_API_URL: ${{ steps.api.outputs.url }}
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-export
          path: out
