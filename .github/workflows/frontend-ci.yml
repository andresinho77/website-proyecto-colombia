name: "Frontend Next.js CI/CD Pipeline"

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  frontend-ci:
    name: "Next.js Build & Type Check"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Verify OpenWolf project index
        run: |
          before_file="$(mktemp)"
          after_file="$(mktemp)"

          git show HEAD:.wolf/anatomy.md | sed -E 's/(Last scanned: ).*/\1<normalized>/' > "$before_file"
          npx --yes openwolf@2.0.1 scan
          sed -E 's/(Last scanned: ).*/\1<normalized>/' .wolf/anatomy.md > "$after_file"

          if ! diff -u "$before_file" "$after_file" > /tmp/openwolf-anatomy.diff; then
            echo "::warning title=OpenWolf::OpenWolf anatomy changed beyond timestamp metadata. Run 'npx --yes openwolf@2.0.1 scan' locally and commit .wolf updates."
            cat /tmp/openwolf-anatomy.diff
          fi

      - name: Build Next.js Static Export
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-export
          path: out
